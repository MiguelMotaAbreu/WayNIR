name: waynir

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: waynir
      POSTGRES_USER: waynir
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-waynir_dev_only}
      TZ: America/Sao_Paulo
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - waynir_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waynir -d waynir"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  waynir_postgres_data:
